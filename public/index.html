<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>MYTHRION</title>
</head>
<body class="bg-slate-950 text-white min-h-screen p-6">
  <main class="max-w-4xl mx-auto">

    <h1 class="text-4xl font-bold mb-2"> 🌓MYTHRION☀️ </h1>
    <p class="text-slate-400 mb-8">O Mythrion reúne e organiza criaturas mitológicas, lendas e seres sobrenaturais em um só lugar.</p>

    <!-- CREATE -->
    <section class="mb-10">
      <h2 class="text-2xl font-semibold mb-3">Cadastrar novo herói</h2>
      <form id="heroForm" class="grid gap-4 bg-slate-800 p-5 rounded-xl sm:grid-cols-2">
        <input id="name" placeholder="Nome"
          class="p-2 rounded bg-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-800" />
        <input id="universe" placeholder="Universo (Mitologia, Monster High ...)"
          class="p-2 rounded bg-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-800" />
        <input id="power" placeholder="Poder"
          class="p-2 rounded bg-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-800 sm:col-span-2" />
        <button class="bg-purple-700 hover:bg-purple-900 transition p-2 rounded font-semibold sm:col-span-2">
          Cadastrar
        </button>
      </form>
    </section>

   <!-- READ / UPDATE / DELETE -->
    <section>
      <h2 class="text-3xl font-semibold mb-5">📜 Arquivo de Entidades</h2>
  
      <div id="heroesList" class="grid gap-4 sm:grid-cols-2"></div>
    </section>

  </main>

  <!-- MODAL DE EDIÇÃO -->
  <dialog id="editDialog"
    class="m-auto w-full max-w-md rounded-2xl border border-purple-500/30 bg-slate-800 p-0 text-white shadow-2xl shadow-purple-500/20 backdrop:bg-black/70 backdrop:backdrop-blur-sm">

    <form id="editForm" class="p-6 space-y-5">

      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-purple-400"> 🌓Editar Arquivo☀️ </h2>
        <button type="button" id="closeEdit"
          class="rounded-lg px-2 py-1 text-slate-400 transition hover:bg-white/10 hover:text-white">✕</button>
      </div>

      <label class="block space-y-1">
        <span class="text-sm text-slate-400">Nome</span>
        <input id="editName"
          class="w-full rounded-lg bg-slate-700 p-3 focus:outline-none focus:ring-2 focus:ring-indigo-800" />
      </label>

      <label class="block space-y-1">
        <span class="text-sm text-slate-400">Universo</span>
        <input id="editUniverse"
          class="w-full rounded-lg bg-slate-700 p-3 focus:outline-none focus:ring-2 focus:ring-indigo-800" />
      </label>

      <label class="block space-y-1">
        <span class="text-sm text-slate-400">Poder</span>
        <input id="editPower"
          class="w-full rounded-lg bg-slate-700 p-3 focus:outline-none focus:ring-2 focus:ring-indigo-800" />
      </label>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" id="cancelEdit"
          class="rounded-lg px-4 py-2 text-slate-300 transition hover:bg-white/10">Cancelar</button>
        <button
          class="rounded-lg bg-purple-700 px-5 py-2 font-semibold transition hover:bg-purple-900">Salvar</button>
      </div>

    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
